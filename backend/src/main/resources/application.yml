server:
    port: 8080
    servlet:
        context-path: /api/v1

spring:
    servlet:
        multipart:
            max-file-size: 1MB
            max-request-size: 1MB

    rabbitmq:
        host: ${SPRING_RABBITMQ_HOST:localhost}
        port: ${SPRING_RABBITMQ_PORT:5672}
        username: ${SPRING_RABBITMQ_USERNAME:dms}
        password: ${SPRING_RABBITMQ_PASSWORD:dms_password}
        listener:
            simple:
                acknowledge-mode: manual
                prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:1}

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dms}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:123456}

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    jackson:
        date-format: yyyy-MM-dd'T'HH:mm:ss
        time-zone: Asia/Ho_Chi_Minh

logging:
    level:
        org.springframework.security: TRACE

app:
    jwt:
        secret: ${JWT_SECRET:this-is-a-default-secret-key-that-is-at-least-32-bytes-long}
        access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
        refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    storage:
        s3:
            endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
            bucket: ${STORAGE_BUCKET:dms-documents}
            access-key: ${STORAGE_ACCESS_KEY}
            secret-key: ${STORAGE_SECRET_KEY}
            region: ${STORAGE_REGION:auto}
            path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
        max-file-size: ${FILE_MAX_SIZE:52428800}
        batch-upload:
            max-files: ${BATCH_UPLOAD_MAX_FILES:20}
        presigned-upload-ttl: ${STORAGE_PRESIGNED_UPLOAD_TTL:PT5M}
        presigned-download-ttl: ${STORAGE_PRESIGNED_DOWNLOAD_TTL:PT5M}
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    search:
        language: ${SEARCH_LANGUAGE:simple}
        enable-unaccent: true
        enable-trigram: true
        enable-vector-search: ${SEARCH_ENABLE_VECTOR:false}
    trash:
        retention-days: ${TRASH_RETENTION_DAYS:30}
        purge-cron: ${TRASH_PURGE_CRON:0 0 2 * * *}
    processing:
        thread-pool-size: ${PROCESSING_THREAD_POOL_SIZE:4}
        retry-interval: ${PROCESSING_RETRY_INTERVAL:PT30M}
        max-retry-count: ${PROCESSING_MAX_RETRY_COUNT:3}
    ocr:
        languages: ${OCR_LANGUAGES:vie+eng}
        dpi: ${OCR_DPI:200}
        max-pages: ${OCR_MAX_PAGES:20}
        timeout-per-page: ${OCR_TIMEOUT_PER_PAGE:PT30S}
        min-pdf-text-length: ${OCR_MIN_PDF_TEXT_LENGTH:20}
    preview:
        enabled: ${PREVIEW_ENABLED:true}
        timeout: ${PREVIEW_TIMEOUT:PT2M}
        office-home: ${PREVIEW_OFFICE_HOME:}
        max-tasks-per-process: ${PREVIEW_MAX_TASKS_PER_PROCESS:20}
        object-prefix: ${PREVIEW_OBJECT_PREFIX:preview}
